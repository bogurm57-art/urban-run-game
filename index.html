<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Urban Run — İlk Prototip</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91b8c8;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #000}
#brand{position:absolute;top:14px;left:14px;font-weight:800;font-size:18px;letter-spacing:1px}
#hint{position:absolute;top:42px;left:14px;font-size:12px;background:#0008;padding:7px 10px;border-radius:8px}
#joy{position:absolute;left:22px;bottom:25px;width:132px;height:132px;border:2px solid #ffffff88;border-radius:50%;background:#0003;pointer-events:auto}
#stick{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#ffffffbb;box-shadow:0 3px 10px #0005}
#actions{position:absolute;right:20px;bottom:30px;display:flex;gap:12px;pointer-events:auto}
.action{width:66px;height:66px;border-radius:50%;border:2px solid #fff9;background:#172b3dcc;color:#fff;font-weight:bold;font-size:12px}
#status{position:absolute;right:14px;top:14px;background:#0008;padding:8px 10px;border-radius:8px;font-size:12px}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:#fff9}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="brand">URBAN RUN <span style="color:#ffd166">ALPHA</span></div>
 <div id="hint">Sol joystick: hareket • Sağ taraf: kamera</div>
 <div id="status">ÇEVRİMDIŞI PROTOTİP<br>Çok oyunculu: sonraki aşama</div>
 <div id="center">+</div>
 <div id="joy"><div id="stick"></div></div>
 <div id="actions"><button class="action" id="run">KOŞ</button><button class="action" id="jump">ZIPLA</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5d5);
scene.fog=new THREE.Fog(0x9bc5d5,38,115);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f5ff,0x59604c,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-25,45,25);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.88});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x647d62));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x343b42),sideMat=mat(0xb6b5a8),lineMat=mat(0xe9dfb7);
function slab(x,z,w,d,m,y=.025){let o=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),m);o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o}
slab(0,0,15,220,roadMat);slab(0,0,220,15,roadMat);
for(let i=-100;i<=100;i+=10){slab(i,0,1.1,220,sideMat,-.01);slab(0,i,220,1.1,sideMat,-.01)}
for(let i=-100;i<=100;i+=8){slab(i,0,.16,5,lineMat,.075);slab(0,i,5,.16,lineMat,.075)}
// city blocks
const colors=[0xb7a18c,0x9eabb0,0xc7bca5,0x8c9d91,0xb5a1a1,0xaaaebd];
function building(x,z,w,d,h,c){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.25,d+.25),mat(0x555b60));roof.position.y=h+.12;g.add(roof);
 const winmat=new THREE.MeshStandardMaterial({color:0x294b5c,metalness:.15,roughness:.25});
 for(let y=2.3;y<h-1;y+=2.5) for(let xx=-w/2+1.2;xx<w/2-0.4;xx+=2.3){
  for(const side of [-1,1]){let win=new THREE.Mesh(new THREE.BoxGeometry(.95,1.15,.08),winmat);win.position.set(xx,y,side*(d/2+.045));g.add(win)}
 }
 g.position.set(x,0,z);scene.add(g);
}
for(let x=-42;x<=42;x+=14)for(let z=-42;z<=42;z+=14){
 if(Math.abs(x)<9||Math.abs(z)<9)continue;
 let h=8+Math.random()*17;building(x+(Math.random()-.5)*2,z+(Math.random()-.5)*2,8+Math.random()*3,8+Math.random()*3,h,colors[Math.floor(Math.random()*colors.length)]);
}
// player capsule
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,4,8),mat(0x2866a6));body.position.y=1.15;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.31,12,10),mat(0xd5a47d));head.position.y=2.02;head.castShadow=true;player.add(head);
const shirt=new THREE.Mesh(new THREE.BoxGeometry(.72,.5,.48),mat(0x26384c));shirt.position.set(0,1.25,0);player.add(shirt);
player.position.set(0,0,5);scene.add(player);
let yaw=0,moveX=0,moveY=0,run=false,vy=0,onGround=true;
const clock=new THREE.Clock();
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');
let joyId=null;
function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;let len=Math.hypot(dx,dy),max=42;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=dy/max}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function resetJoy(){joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
document.querySelector('#run').addEventListener('pointerdown',()=>run=true);
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.querySelector('#run').addEventListener(ev,()=>run=false));
document.querySelector('#jump').addEventListener('pointerdown',()=>{if(onGround){vy=7;onGround=false}});
let lookId=null,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.42){lookId=e.pointerId;lastX=e.clientX;renderer.domElement.setPointerCapture(lookId)}});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookId){yaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});
renderer.domElement.addEventListener('pointerup',()=>lookId=null);
function animate(){
 requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 let dir=forward.multiplyScalar(-moveY).add(right.multiplyScalar(moveX));
 if(dir.length()>1)dir.normalize();
 const speed=run?8:4.5;
 player.position.addScaledVector(dir,speed*dt);
 if(dir.lengthSq()>.01)player.rotation.y=Math.atan2(dir.x,dir.z);
 vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*7,player.position.y+4.2,player.position.z+Math.cos(yaw)*7);
 camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
