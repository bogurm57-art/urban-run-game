<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>Urban Run — City Alpha 0.3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9aabb5;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 7px #000b}
#topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#brand{font-weight:950;letter-spacing:1.3px;font-size:clamp(15px,2.1vw,23px);background:#0b1722a8;border:1px solid #ffffff22;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px)}
#brand span{color:#ffc965}
#info{font-size:11px;line-height:1.45;text-align:right;background:#0b1722c9;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;backdrop-filter:blur(8px)}
#help{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 48px);left:max(12px,env(safe-area-inset-left));font-size:11px;background:#0b1722a8;border:1px solid #ffffff20;border-radius:9px;padding:7px 10px;color:#f3f5f6}
#joy{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:clamp(105px,17vh,142px);height:clamp(105px,17vh,142px);border:2px solid #ffffff88;border-radius:50%;background:#07121b55;box-shadow:inset 0 0 24px #0004;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;margin:-25px;width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#fff,#b9c4cc);box-shadow:0 5px 18px #0008}
#actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.action{width:clamp(61px,10vh,76px);height:clamp(61px,10vh,76px);border-radius:50%;border:2px solid #ffffffa8;background:linear-gradient(145deg,#243e54ed,#102333ed);color:#fff;font-weight:850;font-size:11px;letter-spacing:.3px;box-shadow:0 5px 16px #0006;touch-action:none}
.action.active{background:linear-gradient(145deg,#c28b39,#8d5d20);transform:scale(.96)}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;color:#ffffffb0}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:8px 13px;background:#101923d9;border:1px solid #ffffff28;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s}
#rotate{display:none;position:fixed;inset:0;background:#101923f2;z-index:10;color:white;align-items:center;justify-content:center;text-align:center;padding:25px;font-weight:800}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:420px){#brand{padding:6px 9px}#help{top:49px}.action{width:58px;height:58px}#joy{width:100px;height:100px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="topbar"><div id="brand">URBAN RUN <span>CITY ALPHA 0.3</span></div><div id="info">MODERN CITY<br>FREE ROAM • MOBILE</div></div>
 <div id="help">SOL JOYSTICK: HAREKET &nbsp;•&nbsp; SAĞ TARAF: KAMERA</div>
 <div id="center">＋</div><div id="toast"></div>
 <div id="joy"><div id="stick"></div></div>
 <div id="actions"><button class="action" id="run">KOŞ</button><button class="action" id="jump">ZIPLA</button></div>
</div>
<div id="rotate">URBAN RUN<br><br>Oyunu yatay oynamak için telefonunu yan çevir.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9c2ce);
scene.fog=new THREE.Fog(0xa9c2ce,105,285);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,420);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});
const quality=innerWidth<900?1.25:1.55;
renderer.setPixelRatio(Math.min(devicePixelRatio,quality));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
root.appendChild(renderer.domElement);

// Procedural tileable materials: no external asset downloads required.
function canvasTexture(draw,w=512,h=512,repeatX=1,repeatY=1){
 const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');draw(ctx,w,h);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeatX,repeatY);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;
}
function noiseTexture(base,light,amount=1700){
 return canvasTexture((ctx,w,h)=>{ctx.fillStyle=base;ctx.fillRect(0,0,w,h);for(let i=0;i<amount;i++){const v=Math.random();ctx.fillStyle=v>.5?light:'rgba(0,0,0,.10)';ctx.globalAlpha=.05+Math.random()*.18;const s=Math.random()*2+1;ctx.fillRect(Math.random()*w,Math.random()*h,s,s)}ctx.globalAlpha=1;},512,512,4,4);
}
const asphaltTex=noiseTexture('#343b42','#aab0b1',3200);
const sidewalkTex=noiseTexture('#9c9d98','#ffffff',1900);
const roadMat=new THREE.MeshStandardMaterial({map:asphaltTex,color:0xffffff,roughness:.96});
const pavementMat=new THREE.MeshStandardMaterial({map:sidewalkTex,color:0xffffff,roughness:.94});
const curbMat=new THREE.MeshStandardMaterial({color:0xb9b9b2,roughness:.9});
const lineMat=new THREE.MeshStandardMaterial({color:0xe8e5d9,roughness:.8});
const grassMat=new THREE.MeshStandardMaterial({color:0x526b52,roughness:1});
const asphaltDark=new THREE.MeshStandardMaterial({color:0x242d35,roughness:.95});
const facadeColors=[0xb9b7ae,0x9aa9b0,0xc6bba9,0x8f9da1,0xa7a5a0,0x777f87,0xc2c8c7,0x9daba5];
const facadeMats=facadeColors.map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.88}));
const glassMat=new THREE.MeshStandardMaterial({color:0x34566a,metalness:.38,roughness:.23});
const darkGlassMat=new THREE.MeshStandardMaterial({color:0x172f3d,metalness:.35,roughness:.2});
const frameMat=new THREE.MeshStandardMaterial({color:0xd0d0c8,roughness:.75});
const roofMat=new THREE.MeshStandardMaterial({color:0x555e63,roughness:.9});
const metalMat=new THREE.MeshStandardMaterial({color:0x454d52,metalness:.65,roughness:.4});
const woodMat=new THREE.MeshStandardMaterial({color:0x715239,roughness:1});
const leafMats=[0x315b42,0x426e4b,0x557b4d].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));

scene.add(new THREE.HemisphereLight(0xe8f5ff,0x566052,1.55));
const sun=new THREE.DirectionalLight(0xffe4c1,2.15);sun.position.set(-65,95,55);sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.left=-105;sun.shadow.camera.right=105;sun.shadow.camera.top=105;sun.shadow.camera.bottom=-105;sun.shadow.bias=-.00025;sun.shadow.normalBias=.035;scene.add(sun);
const fill=new THREE.DirectionalLight(0xb7d8ef,.48);fill.position.set(50,35,-60);scene.add(fill);

const staticGroup=new THREE.Group();scene.add(staticGroup);
const buildingGroup=new THREE.Group();scene.add(buildingGroup);
const detailGroup=new THREE.Group();scene.add(detailGroup);
const collisionRects=[];
function addBox(parent,w,h,d,mat,x,y,z,cast=false,receive=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=receive;parent.add(m);return m;
}
function addPlane(parent,w,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;parent.add(m);return m}
function addCollider(x,z,w,d,pad=.0){collisionRects.push({minX:x-w/2-pad,maxX:x+w/2+pad,minZ:z-d/2-pad,maxZ:z+d/2+pad})}

// City grid: continuous roads, raised sidewalks, properly aligned corner crossings.
const GRID=52, ROAD=15, HALF=ROAD/2, CITY=4;
addPlane(staticGroup,GRID*CITY*2+ROAD,GRID*CITY*2+ROAD,grassMat,0,-.16,0);
const roadCenters=[];for(let i=-CITY;i<=CITY;i++)roadCenters.push(i*GRID);
for(const z of roadCenters)addBox(staticGroup,GRID*CITY*2+ROAD,.12,ROAD,roadMat,0,-.075,z,false,true);
for(const x of roadCenters)addBox(staticGroup,ROAD,.12,GRID*CITY*2+ROAD,roadMat,x,-.073,0,false,true);

// Sidewalk strips live only along the block edges; intersections remain clean.
const blockHalf=(GRID-ROAD)/2;
for(let ix=-CITY;ix<CITY;ix++)for(let iz=-CITY;iz<CITY;iz++){
 const cx=(ix+.5)*GRID,cz=(iz+.5)*GRID;
 const edge=blockHalf,sw=3.2;
 // Four sidewalk strips, with a narrow curb at the roadway boundary.
 addBox(staticGroup,sw,.24,GRID-ROAD, pavementMat,cx-edge+sw/2,.035,cz);
 addBox(staticGroup,sw,.24,GRID-ROAD, pavementMat,cx+edge-sw/2,.035,cz);
 addBox(staticGroup,GRID-ROAD,.24,sw,pavementMat,cx,.035,cz-edge+sw/2);
 addBox(staticGroup,GRID-ROAD,.24,sw,pavementMat,cx,.035,cz+edge-sw/2);
 addBox(staticGroup,.28,.34,GRID-ROAD,curbMat,cx-edge+sw,.07,cz);
 addBox(staticGroup,.28,.34,GRID-ROAD,curbMat,cx+edge-sw,.07,cz);
 addBox(staticGroup,GRID-ROAD,.34,.28,curbMat,cx,.07,cz-edge+sw);
 addBox(staticGroup,GRID-ROAD,.34,.28,curbMat,cx,.07,cz+edge-sw);
}
// Lane dividers, short dashed markings, stop bars and zebra crossings.
function stripe(x,z,w,d,y=.006,mat=lineMat){addBox(staticGroup,w,.025,d,mat,x,y,z)}
for(const z of roadCenters)for(let x=-CITY*GRID+8;x<=CITY*GRID-8;x+=10){stripe(x,z,4.2,.13,.006)}
for(const x of roadCenters)for(let z=-CITY*GRID+8;z<=CITY*GRID-8;z+=10){stripe(x,z,.13,4.2,.006)}
function zebra(cx,cz,axis){
 const count=9,spacing=1.12;
 if(axis==='z'){
  for(let i=0;i<count;i++)stripe(cx+(i-(count-1)/2)*spacing,cz, .72,5.2,.012);
  stripe(cx,cz-3.1,11.2,.18,.014);stripe(cx,cz+3.1,11.2,.18,.014);
 }else{
  for(let i=0;i<count;i++)stripe(cx,cz+(i-(count-1)/2)*spacing,5.2,.72,.012);
  stripe(cx-3.1,cz,.18,11.2,.014);stripe(cx+3.1,cz,.18,11.2,.014);
 }
}
// Four crosswalks at each major intersection, positioned on the asphalt before the curb.
for(const x of roadCenters)for(const z of roadCenters){
 zebra(x,z-HALF-3.4,'x');zebra(x,z+HALF+3.4,'x');
 zebra(x-HALF-3.4,z,'z');zebra(x+HALF+3.4,z,'z');
}

// Facade details: vertical mullions, repeating windows, shopfronts, balconies and roof equipment.
function building(x,z,w,d,h,style=0,shop=false){
 const g=new THREE.Group();g.position.set(x,0,z);buildingGroup.add(g);
 const body=addBox(g,w,h,d,facadeMats[style%facadeMats.length],0,h/2,0,true,true);
 addBox(g,w+.35,.38,d+.35,roofMat,0,h+.17,0,true,true);
 const floors=Math.max(2,Math.floor((h-3.5)/3.35));
 const rows=Math.max(2,Math.floor((w-1.6)/2.35));
 for(let f=0;f<floors;f++){
  const y=2.2+f*3.35;
  for(let r=0;r<rows;r++){
   const xx=-w/2+1.2+r*((w-2.4)/Math.max(1,rows-1));
   for(const side of [-1,1]){
    addBox(g,1.22,1.72,.10,(f+r)%4===0?glassMat:darkGlassMat,xx,y,side*(d/2+.065));
    addBox(g,1.32,.10,.16,frameMat,xx,y-.94,side*(d/2+.08));
    addBox(g,.07,1.8,.13,frameMat,xx-.66,y,side*(d/2+.08));
    addBox(g,.07,1.8,.13,frameMat,xx+.66,y,side*(d/2+.08));
   }
  }
  const cols=Math.max(2,Math.floor((d-1.6)/2.4));
  for(let r=0;r<cols;r++){
   const zz=-d/2+1.2+r*((d-2.4)/Math.max(1,cols-1));
   for(const side of [-1,1]){
    addBox(g,.10,1.72,1.25,glassMat,side*(w/2+.065),y,zz);
    addBox(g,.16,.1,1.35,frameMat,side*(w/2+.08),y-.94,zz);
   }
  }
 }
 // Ground floor has a visible recessed storefront and signage.
 if(shop){
  addBox(g,w*.78,2.65,.15,darkGlassMat,0,1.55,d/2+.1);
  addBox(g,w*.83,.58,.22,new THREE.MeshStandardMaterial({color:[0xb68a4e,0x385b70,0x8b4c45][style%3],roughness:.48}),0,3.18,d/2+.13);
  addBox(g,w*.86,.15,1.0,metalMat,0,2.75,d/2+.58);
  addBox(g,.12,2.5,.2,frameMat,-w*.39,1.55,d/2+.2);
  addBox(g,.12,2.5,.2,frameMat,w*.39,1.55,d/2+.2);
 }
 // Balcony rails on selected buildings.
 if(style%3===1&&h>18){
  for(let f=1;f<floors;f+=2){const y=2.6+f*3.35;addBox(g,w*.72,.09,.42,metalMat,0,y,d/2+.22);addBox(g,w*.72,.55,.06,glassMat,0,y+.27,d/2+.4)}
 }
 // Rooftop HVAC, parapets and antenna.
 addBox(g,w*.92,.45,.28,curbMat,0,h+.38,d/2-.2);
 if(h>20){
  for(let i=0;i<2;i++){addBox(g,2.1,1.2,1.8,metalMat,(i-.5)*w*.34,h+.95,0,true);addBox(g,1.65,.12,1.45,frameMat,(i-.5)*w*.34,h+1.58,0)}
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,3,6),metalMat);mast.position.set(w*.25,h+2.5,-d*.2);g.add(mast);
 }
 addCollider(x,z,w+.8,d+.8,.22);
 return g;
}

// Detailed 4x4 city blocks; each block gets a varied cluster and some green courtyards.
for(let ix=-CITY;ix<CITY;ix++)for(let iz=-CITY;iz<CITY;iz++){
 const cx=(ix+.5)*GRID,cz=(iz+.5)*GRID;
 const seed=(ix+CITY)*17+(iz+CITY)*31;
 const park=(Math.abs(seed)%7===0);
 if(park){
  addPlane(detailGroup,23,22,new THREE.MeshStandardMaterial({color:0x53744f,roughness:1}),cx,.02,cz);
  for(let n=0;n<5;n++){const tx=cx-8+(n%3)*8,tz=cz-6+Math.floor(n/3)*11;makeTree(tx,tz,.9)}
  addBox(detailGroup,7,.18,1.2,woodMat,cx,.18,cz+5);
  continue;
 }
 const bw=10+(Math.abs(seed)%3)*1.8,bd=11+(Math.abs(seed*3)%3)*1.6;
 const h1=18+(Math.abs(seed*7)%8)*4;
 building(cx-7,cz-6,bw,bd,h1,Math.abs(seed)%8,seed%2===0);
 building(cx+7,cz+7,bw*.92,bd*.9,13+(Math.abs(seed*11)%6)*3,(Math.abs(seed)+3)%8,seed%3===0);
 // Small paved courtyard / loading zone between structures.
 addPlane(detailGroup,5,5,pavementMat,cx,.03,cz);
}

// Parked cars parallel to curb, with wheels, windows, lights and collision boxes.
const tireMat=new THREE.MeshStandardMaterial({color:0x15191d,roughness:.92});
const carPaint=[0x253b50,0xb9bfc1,0x7d3030,0xb69a68,0x24282c,0x49665e].map(c=>new THREE.MeshStandardMaterial({color:c,metalness:.42,roughness:.34}));
function makeCar(x,z,rot,color=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;detailGroup.add(g);
 addBox(g,2.05,.68,4.15,carPaint[color%carPaint.length],0,.72,0,true);
 addBox(g,1.72,.78,2.18,glassMat,0,1.42,-.12,true);
 addBox(g,1.82,.10,2.25,metalMat,0,1.03,-.12);
 for(const xx of [-.96,.96])for(const zz of [-1.32,1.32]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.23,12),tireMat);wheel.rotation.z=Math.PI/2;wheel.position.set(xx,.39,zz);g.add(wheel);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.24,10),metalMat);hub.rotation.z=Math.PI/2;hub.position.set(xx*1.005,.39,zz);g.add(hub);
 }
 const lampMat=new THREE.MeshStandardMaterial({color:0xfff1ce,emissive:0xffe3a5,emissiveIntensity:.22});
 for(const xx of [-.68,.68]){addBox(g,.34,.18,.08,lampMat,xx,.78,2.09);addBox(g,.34,.18,.08,new THREE.MeshStandardMaterial({color:0x9c2520,emissive:0x4b0805}),xx,.78,-2.09)}
 addCollider(x,z,2.5,4.7,.18);return g;
}
const carSpots=[];
for(let k=-3;k<=3;k++)for(const z of [-k*GRID+HALF+2.5,k*GRID-HALF-2.5]){
 if(Math.abs(z)<12)continue;
 carSpots.push([HALF-2.2,z,Math.PI/2,(k+5)%6]);
}
for(const [x,z,r,c] of carSpots.slice(0,18))makeCar(x,z,r,c);

// Trees, planters, street lamps and benches placed on sidewalk strips, never blocking crossings.
function makeTree(x,z,scale=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);detailGroup.add(g);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,2.2,8),woodMat);trunk.position.y=1.1;trunk.castShadow=true;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.15,12,9),leafMats[Math.abs(Math.floor(x+z))%3]);crown.position.y=2.75;crown.scale.set(1,1.2,1);crown.castShadow=true;g.add(crown);
 const planter=new THREE.Mesh(new THREE.CylinderGeometry(.65,.7,.32,10),curbMat);planter.position.y=.16;g.add(planter);
}
function makeLamp(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);detailGroup.add(g);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.065,.11,5.6,8),metalMat);pole.position.y=2.8;pole.castShadow=true;g.add(pole);
 addBox(g,.1,.12,1.15,metalMat,0,5.25,.48);
 const head=addBox(g,.62,.17,.48,new THREE.MeshStandardMaterial({color:0xffe5ae,emissive:0xffd18a,emissiveIntensity:.55}),0,5.15,.95);
}
for(let ix=-CITY;ix<CITY;ix++)for(let iz=-CITY;iz<CITY;iz++){
 const cx=(ix+.5)*GRID,cz=(iz+.5)*GRID,edge=blockHalf-1.6;
 makeLamp(cx-edge,cz-10);makeLamp(cx+edge,cz+10);
 makeTree(cx-edge,cz+10,.85);makeTree(cx+edge,cz-10,.85);
}

// Character: capsule body with articulated arms/legs, face and animated stride.
const player=new THREE.Group();scene.add(player);
const skinMat=new THREE.MeshStandardMaterial({color:0xc9906c,roughness:.82});
const shirtMat=new THREE.MeshStandardMaterial({color:0x17649a,roughness:.8});
const pantsMat=new THREE.MeshStandardMaterial({color:0x202a36,roughness:.92});
const shoeMat=new THREE.MeshStandardMaterial({color:0x111820,roughness:.9});
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.39,.68,5,10),shirtMat);torso.position.y=1.23;torso.castShadow=true;player.add(torso);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.18,10),skinMat);neck.position.y=1.77;player.add(neck);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,18,14),skinMat);head.position.y=2.05;head.castShadow=true;player.add(head);
const face=new THREE.Mesh(new THREE.SphereGeometry(.055,8,6),new THREE.MeshStandardMaterial({color:0x30251f}));face.position.set(0,.02,-.27);head.add(face);
const limbs={};
for(const s of [-1,1]){
 const leg=new THREE.Group();leg.position.set(s*.19,.78,0);player.add(leg);
 const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.145,.52,4,8),pantsMat);thigh.position.y=-.26;thigh.castShadow=true;leg.add(thigh);
 const foot=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.46),shoeMat);foot.position.set(0,-.63,-.1);foot.castShadow=true;leg.add(foot);
 const arm=new THREE.Group();arm.position.set(s*.47,1.48,0);player.add(arm);
 const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,4,8),shirtMat);upper.position.y=-.27;upper.castShadow=true;arm.add(upper);
 const hand=new THREE.Mesh(new THREE.SphereGeometry(.12,9,8),skinMat);hand.position.y=-.57;arm.add(hand);
 limbs[s<0?'leftLeg':'rightLeg']=leg;limbs[s<0?'leftArm':'rightArm']=arm;
}
player.position.set(0,0,0);

// Spawn protection: start on open intersection. AABB collision resolves each movement axis separately.
let yaw=0,moveX=0,moveY=0,isRunning=false,vy=0,onGround=true,lookId=null,lastX=0;
const clock=new THREE.Clock();
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');
let joyId=null;
function setJoy(e){
 const r=joy.getBoundingClientRect(),dx0=e.clientX-r.left-r.width/2,dy0=e.clientY-r.top-r.height/2;
 const len=Math.hypot(dx0,dy0),max=43,scale=len>max?max/len:1,dx=dx0*scale,dy=dy0*scale;
 stick.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=dy/max;
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function resetJoy(){joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
const runButton=document.querySelector('#run');
runButton.addEventListener('pointerdown',e=>{e.preventDefault();isRunning=true;runButton.classList.add('active')});
['pointerup','pointercancel','pointerleave'].forEach(ev=>runButton.addEventListener(ev,()=>{isRunning=false;runButton.classList.remove('active')}));
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();if(onGround){vy=7.2;onGround=false}});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.42){lookId=e.pointerId;lastX=e.clientX;renderer.domElement.setPointerCapture(lookId)}});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookId){yaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});
renderer.domElement.addEventListener('pointerup',()=>lookId=null);
renderer.domElement.addEventListener('pointercancel',()=>lookId=null);

function blockedAt(x,z){
 const r=.48;
 for(const b of collisionRects){
  if(x+r>b.minX&&x-r<b.maxX&&z+r>b.minZ&&z-r<b.maxZ)return true;
 }
 return false;
}
function moveWithCollision(dx,dz){
 const nx=player.position.x+dx,nz=player.position.z+dz;
 if(!blockedAt(nx,player.position.z))player.position.x=nx;
 if(!blockedAt(player.position.x,nz))player.position.z=nz;
}
function showToast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.style.opacity=1;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.style.opacity=0,1700)}
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const dir=forward.multiplyScalar(-moveY).add(right.multiplyScalar(moveX));
 const inputMag=Math.min(1,dir.length());if(dir.length()>1)dir.normalize();
 const speed=isRunning?8.3:4.6;
 const dx=dir.x*speed*dt,dz=dir.z*speed*dt;
 // Substeps prevent tunnelling through thin collision boundaries.
 const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.22));
 for(let i=0;i<steps;i++)moveWithCollision(dx/steps,dz/steps);
 if(inputMag>.08){
  player.rotation.y=Math.atan2(dir.x,dir.z);
  const stride=Math.sin(clock.elapsedTime*(isRunning?13:8))*inputMag;
  limbs.leftLeg.rotation.x=stride*.62;limbs.rightLeg.rotation.x=-stride*.62;
  limbs.leftArm.rotation.x=-stride*.48;limbs.rightArm.rotation.x=stride*.48;
  torso.position.y=1.23+Math.abs(stride)*.025;
 }else{
  for(const k of ['leftLeg','rightLeg','leftArm','rightArm'])limbs[k].rotation.x=THREE.MathUtils.damp(limbs[k].rotation.x,0,9,dt);
  torso.position.y=THREE.MathUtils.damp(torso.position.y,1.23,8,dt);
 }
 vy-=19*dt;player.position.y+=vy*dt;
 if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-CITY*GRID+5,CITY*GRID-5);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-CITY*GRID+5,CITY*GRID-5);
 const desired=new THREE.Vector3(player.position.x+Math.sin(yaw)*7.4,player.position.y+4.2,player.position.z+Math.cos(yaw)*7.4);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,player.position.y+1.15,player.position.z);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,quality));renderer.setSize(innerWidth,innerHeight)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){isRunning=false;resetJoy()}});
showToast('Şehir hazır • Binalar artık çarpışmalı');
</script>
</body></html>
